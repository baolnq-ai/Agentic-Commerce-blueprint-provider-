# NVIDIA NIM Local Runtime (host-exposed OpenAI-compatible endpoints)
#
# Exposes:
# - LLM:   http://127.0.0.1:8010/v1
# - Embed: http://127.0.0.1:8011/v1
#
# Notes:
# - Requires NVIDIA GPU + NVIDIA Container Toolkit.
# - Uses NVIDIA API key for model access where required.

services:
  nim-llm:
    image: ${NIM_LLM_IMAGE:-nvcr.io/nim/meta/llama-3.2-3b-instruct:latest}
    ports:
      - "${NIM_LLM_HOST_PORT:-8010}:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NIM_LLM_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NGC_API_KEY=${NGC_API_KEY:-${NVIDIA_API_KEY}}
      - NIM_MODEL_NAME=${NIM_LLM_MODEL_NAME:-meta/llama-3.2-3b-instruct}
      - NIM_MODEL_PROFILE=${NIM_LLM_MODEL_PROFILE:-4f904d571fe60ff24695b5ee2aa42da58cb460787a968f1e8a09f5a7e862728d}
      - NIM_MAX_MODEL_LEN=${NIM_LLM_MAX_MODEL_LEN:-4096}
      - NIM_KVCACHE_PERCENT=${NIM_LLM_KVCACHE_PERCENT:-0.55}
      - NIM_RELAX_MEM_CONSTRAINTS=${NIM_LLM_RELAX_MEM_CONSTRAINTS:-1}
      - NIM_NUM_KV_CACHE_SEQ_LENS=${NIM_LLM_NUM_KV_CACHE_SEQ_LENS:-1}
      - NIM_LOW_MEMORY_MODE=${NIM_LLM_LOW_MEMORY_MODE:-1}
    runtime: nvidia
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 20s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  nim-embed:
    image: ${NIM_EMBED_IMAGE:-nvcr.io/nim/nvidia/nv-embedqa-e5-v5:latest}
    ports:
      - "${NIM_EMBED_HOST_PORT:-8011}:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NIM_EMBED_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NGC_API_KEY=${NGC_API_KEY:-${NVIDIA_API_KEY}}
      - NIM_MODEL_NAME=${NIM_EMBED_MODEL_NAME:-nvidia/nv-embedqa-e5-v5}
    runtime: nvidia
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 20s
      timeout: 10s
      retries: 60
    restart: unless-stopped
