name: ci-production-gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src/merchant src/apps_sdk src/payment tests

      - name: Pytest with coverage
        run: uv run pytest tests --cov=src --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-report
          path: pytest-report.xml

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: src/ui/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  security-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Export requirements
        run: uv export --no-hashes --all-extras --format requirements-txt > requirements-ci.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: |
          set +e
          pip-audit -r requirements-ci.txt -f json -o pip-audit-report.json
          status=$?
          cat pip-audit-report.json
          exit $status

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-report
          path: pip-audit-report.json

  security-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: src/ui/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: |
          set +e
          pnpm audit --audit-level high --json > npm-audit-report.json
          status=$?
          cat npm-audit-report.json
          exit $status

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-security-report
          path: src/ui/npm-audit-report.json

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build merchant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/merchant/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ui/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
